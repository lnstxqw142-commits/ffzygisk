name: Build Zygisk
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build .so
        run: |
          ndk-build \
            NDK_PROJECT_PATH=jni \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk

      - name: Pack Module
        run: |
          mkdir -p module/zygisk
          cp libs/arm64-v8a/libffzygisk.so module/zygisk/arm64-v8a.so

          printf 'id=ffzygisk\nname=FF Native Menu\nversion=4.0\nversionCode=4\nauthor=lnstxqw142\ndescription=FF Native Menu for FF MAX\n' > module/module.prop

          printf '#!/system/bin/sh\nSKIPUNZIP=0\nui_print "- FF Native Menu v4.0"\nset_perm_recursive $MODPATH 0 0 0755 0644\nset_perm $MODPATH/zygisk/arm64-v8a.so 0 0 0644\n' > module/customize.sh
          chmod +x module/customize.sh

          mkdir -p module/META-INF/com/google/android
          printf '#!/sbin/sh\numask 022\nOUTFD=$2\nZIPFILE=$3\nmount /data 2>/dev/null\nui_print() { echo "$1"; }\n. /data/adb/magisk/util_functions.sh\n[ $MAGISK_VER_CODE -lt 20400 ] && exit 1\ninstall_module\nexit 0\n' > module/META-INF/com/google/android/update-binary
          echo "# Magisk" > module/META-INF/com/google/android/updater-script

          cd module
          zip -r ../FFZygisk.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: FFZygisk
          path: FFZygisk.zip
