name: Build AntiFrida
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
      - name: Build
        run: |
          ndk-build NDK_PROJECT_PATH=jni APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk
          echo "=== Files in libs ==="
          find jni/libs -type f
      - name: Pack
        run: |
          # Tìm file .so - không cứng đường dẫn
          SO=$(find jni/libs -name "libffaf.so" | head -n1)
          echo "Found SO: $SO"
          ls -la "$SO"

          mkdir -p module/zygisk
          cp "$SO" module/zygisk/arm64-v8a.so
          ls -la module/zygisk/

          printf 'id=ffaf\nname=FF AntiFrida\nversion=1.0\nversionCode=1\nauthor=lnstxqw142\ndescription=Disable FF anti-frida\n' > module/module.prop
          printf '#!/system/bin/sh\nSKIPUNZIP=0\nset_perm_recursive $MODPATH 0 0 0755 0644\nset_perm $MODPATH/zygisk/arm64-v8a.so 0 0 0644\n' > module/customize.sh
          chmod +x module/customize.sh
          mkdir -p module/META-INF/com/google/android
          printf '#!/sbin/sh\numask 022\nOUTFD=$2\nZIPFILE=$3\nmount /data 2>/dev/null\nui_print() { echo "$1"; }\n. /data/adb/magisk/util_functions.sh\n[ $MAGISK_VER_CODE -lt 20400 ] && exit 1\ninstall_module\nexit 0\n' > module/META-INF/com/google/android/update-binary
          echo "# Magisk" > module/META-INF/com/google/android/updater-script

          cd module
          zip -r ../FFAntiFrida.zip .
          cd ..
          echo "=== FINAL ZIP ==="
          unzip -l FFAntiFrida.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FFAntiFrida
          path: FFAntiFrida.zip
