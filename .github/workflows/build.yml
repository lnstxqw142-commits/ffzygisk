name: Build Inject SO
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
      - name: Build .so
        run: |
          ndk-build NDK_PROJECT_PATH=jni APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk
      - name: Pack
        run: |
          mkdir -p out/libs/arm64-v8a
          cp jni/libs/arm64-v8a/libZyGames.so out/libs/arm64-v8a/libZyGames.so
          cp jni/../start.sh out/start.sh 2>/dev/null || true
          cd out
          zip -r ../FFInject.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: FFInject
          path: FFInject.zip
